name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/watchdog

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write signing key
        run: |
          echo "${{ secrets.SHIZUKU_KEYSTORE }}" | base64 --decode > key.jks
          echo "KEYSTORE_FILE=../key.jks" > signing.properties
          echo "KEYSTORE_PASSWORD=android" >> signing.properties
          echo "KEYSTORE_ALIAS=shizuku" >> signing.properties
          echo "KEYSTORE_ALIAS_PASSWORD=android" >> signing.properties

      - name: Build debug
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          ./gradlew :manager:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shizuku-watchdog-debug
          path: manager/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 9
